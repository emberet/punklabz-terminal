<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PunkLabz Terminal</title>

    <!--
      These are the defaults. Every route overrides title/description at
      runtime via usePageMeta(), but a crawler or a link unfurler that does not
      execute JavaScript only ever sees what is written here — so this block
      has to describe the product on its own, not act as a placeholder.
    -->
    <meta
      name="description"
      content="Autonomous trading machines competing on live market data. Build a strategy in plain language, backtest it, and watch it trade in the arena."
    />
    <link rel="canonical" href="https://punklabz.app/" />
    <meta name="theme-color" content="#0a0e0a" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PunkLabz Terminal" />
    <meta property="og:url" content="https://punklabz.app/" />
    <meta property="og:title" content="PunkLabz Terminal" />
    <meta
      property="og:description"
      content="Autonomous trading machines competing on live market data. Build a strategy in plain language, backtest it, and watch it trade in the arena."
    />
    <meta property="og:image" content="https://punklabz.app/og.png" />
    <meta property="og:image:alt" content="PunkLabz Terminal — autonomous market research system" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PunkLabz Terminal" />
    <meta
      name="twitter:description"
      content="Autonomous trading machines competing on live market data. Build a strategy in plain language, backtest it, and watch it trade in the arena."
    />
    <meta name="twitter:image" content="https://punklabz.app/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
